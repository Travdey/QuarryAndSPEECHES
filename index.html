<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./imgs/favicon.png" type="image/png">
    <title>КАРЬЕР И РЕЧИ</title>
    <style>
        @font-face {
            font-family: "Bell Gothic Bold";
            src: url("fonts/Bell-Gothic_Bold.ttf") format("truetype");
            font-weight: bold;
            font-style: normal;
        }

        body {
            position: relative;
            margin: 0;
            padding: 0px;
            font-family: "Bell Gothic Bold", "Bell-Gothic Std", sans-serif;
            background: linear-gradient(180deg, #121133 0%, #161044 0%, #2d2f77 75%, #3c4196, #5356a5, #8487e9 100%);
            min-height: 100vh;
        }

        a {
            color: #8c96ff;
            text-decoration: underline;
        }
        
        .header-text {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #ffffff;
            padding: 32px 25px 12px;
            font-size: 24px;
            opacity: 0;
            transition: opacity 6s ease;
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 1);
        }

        .header-text.is-visible {
            opacity: 1;
        }

        .button-info {
            margin-top: 128px;
            text-align: center;
            color: #ffffff;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 6s ease, transform 6s ease;
        }

        .button-info.is-visible {
            opacity: 0.95;
            transform: translateY(0);
        }

        .button-info .today-date {
            font-size: 24px;
            margin-bottom: 4px;
            opacity: 0.95;
        }

        .button-info .next-dialogue {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .button-info .active-timer {
            display: inline-block;
            font-size: 48px;
            letter-spacing: 1px;
            font-weight: bold;
            padding: 4px 8px;
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 1);
        }

        .reveal-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 760px;
            margin: 0 auto;
            padding: 8px 30px 0;
        }

        .reveal-item {
            text-align: center;
            color: #ffffff;
            opacity: 0;
            transition: opacity 6s ease;
            width: 100%;
        }

        .reveal-item.is-visible {
            opacity: 1;
        }

        .reveal-trigger {
            width: min(100%, 320px);
            max-width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, #000000, #000000);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 20px;
            line-height: 1.3;
            cursor: pointer;
            box-shadow: 0 8px 0px rgb(255, 255, 255);
            font-family: inherit;
            display: inline-block;
            margin: 0 auto;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .reveal-trigger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .reveal-timer {
            margin-top: 10px;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffffff;
            opacity: 0.95;
        }

        .reveal-panel {
            max-height: 0;
            overflow: hidden;
            margin-top: 0;
            padding: 0 20px;
            background: rgba(0, 0, 0, 1);
            border: 1px solid rgb(255, 255, 255);;
            border-radius: 16px;
            box-shadow: 0 8px 0px rgb(255, 255, 255);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transition: max-height 0.5s ease, padding 0.5s ease, margin-top 1s ease, opacity 1s ease;
        }

        .reveal-panel.is-open {
            max-height: 10000px;
            margin-top: 16px;
            padding: 20px;
            opacity: 1;
        }

        .reveal-panel h3 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .reveal-panel p {
            margin: 8px 0;
            line-height: 1.6;
            font-family: inherit;
            font-size: 20px;
        }

        .reveal-note {
            font-size: 15px;
            opacity: 0.85;
        }

        .reveal-media {
            display: inline-block;
            margin-top: 16px;
            max-width: 100%;
        }

        .reveal-media img {
            width: auto;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
            image-rendering: pixelated;
        }
        
        .image-block {
            text-align: center;
            padding: 25px 60px 25px;
            opacity: 0;
            transition: opacity 6s ease;
        }

        .image-block2 {
            text-align: center;
            padding: 25px 60px 25px;
            opacity: 0;
            transition: opacity 6s ease;
        }

        .image-block3 {
            text-align: center;
            padding: 25px 60px 25px;
            opacity: 0;
            transition: opacity 6s ease;
        }

        .image-block.is-visible {
            opacity: 1;
        }

        .image-block2.is-visible {
            opacity: 1;
        }

        .image-block3.is-visible {
            opacity: 1;
        }

        .countdown-summary {
            text-align: center;
            color: #ffffff;
            max-width: 760px;
            margin: 0 auto 10px;
            padding: 0 30px;
            transition: opacity 6s ease, transform 6s ease;
        }

        .today-date {
            font-size: 24px;
            margin-bottom: 6px;
            opacity: 0.95;
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 1);
        }

        .next-dialogue {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 1);
        }

        .next-dialogue span {
            font-weight: bold;
            font-size: 48px;
            letter-spacing: 2px;
        }
        
        .image-block img {
            max-width: 100%;
            height: auto;
        }

        .image-block2 img {
            max-width: 100%;
            height: auto;
        }

        .image-block3 img {
            max-width: 100%;
            height: auto;
        }
        
        .timer-block {
            text-align: center;
            color: #ffffff;
            padding: 40px 20px;
            font-size: 32px;
            opacity: 0;
            transition: opacity 6s ease;
        }

        .timer-block.is-visible {
            opacity: 1;
        }
        
        .timer-display {
            font-size: 48px;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .footer {
            text-align: center;
            padding: 0;
            margin: 0;
            opacity: 0;
            transition: opacity 6s ease;
        }

        .footer.is-visible {
            opacity: 1;
        }

        .footer img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
        }

        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
            background: transparent;
        }

        .star {
            position: absolute;
            background: url('./imgs/star.png') center/contain no-repeat;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            animation-fill-mode: both;
        }

        @keyframes star-fade {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.15);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            80% {
                opacity: 1;
                transform: translate(calc(-50% + 10px), calc(-50% + 8px)) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + 14px), calc(-50% - 8px)) scale(0.2);
            }
        }
    </style>

</head>
<body>
    <div class="header-text">
        КАРЬЕР — место для ежедневного открытия пронумерованных РЕЧЕВЫХ окон. Что же там будет написано?
    </div>

    <div class="image-block" id="imageBlock1">
        <img src="./imgs/kosmo.gif" alt="sonechko gif">
    </div>

    <div class="starfield" id="starfield"></div>

    <div class="reveal-list" id="revealList"></div>

    <div class="button-info" id="summaryBlock">
        <div class="today-date">Сегодняшняя дата это ...</div>
        <div class="next-dialogue">Увидимся спустя день на этом сайте, когда появится новая РЕЧЬ через</div>
        <div class="active-timer" id="summaryTimer" data-target-time="0">00:00:00</div>
    </div>

    <div class="footer" id="footer">
        <img src="./imgs/gif-animation-2_night.gif" alt="Footer GIF">
    </div>
    
    <script>
        function formatCountdown(timeLeft) {
            if (timeLeft <= 0) {
                return '00:00:00';
            }

            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            return String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
        }

        function updateItemTimers() {
            document.querySelectorAll('.reveal-timer, .active-timer').forEach((timer) => {
                const targetTime = Number(timer.dataset.targetTime);
                if (!targetTime) {
                    return;
                }

                timer.textContent = formatCountdown(targetTime - Date.now());
            });
        }

        function updateNextDialogueInfo() {
            const now = new Date();
            const summaryTimer = document.getElementById('summaryTimer');
            const summaryDate = document.querySelector('#summaryBlock .today-date');
            const currentDayIndex = now >= revealStartDate
                ? Math.min(revealTasks.length - 1, Math.floor((now - revealStartDate) / (1000 * 60 * 60 * 24)))
                : -1;
            const targetTime = now < revealStartDate
                ? revealStartDate.getTime()
                : new Date(revealStartDate.getTime() + (currentDayIndex + 1) * 86400000).getTime();

            if (summaryDate) {
                summaryDate.textContent = `Сегодняшняя дата это ${now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}.`;
            }

            if (summaryTimer) {
                summaryTimer.dataset.targetTime = targetTime;
                summaryTimer.textContent = formatCountdown(targetTime - Date.now());
            }
        }
        
        const revealList = document.getElementById('revealList');
        const revealStartDate = new Date(new Date().getFullYear(), 7, 1, 0, 0, 0);
        const revealTasks = [
            { title: '— 1 —', description: 
            '- Стартовая точка. Как говорили раньше: "В начале было слово", но, как оказалось, в начале была "РЕЧЬ 1". Надо же начать очередную загадочную вещь с чего-то, хах!' },
            { title: '— 2 —', description: 
            '- А начну я пожалуй с того, что я сюда буду записывать разные мысли, истории из жизни, и прочие подобные вещи. Конечно, я бы мог однажды в жизни дневник себе завести чтобы делать тоже самое, но уже поздно. Да и можно ли считать эти РЕЧИ своего рода дневником? Я думаю, что можно. По сути я записываю свои мысли сюда. А их поток не остановить… Ах да, ну и самое главное, что я бы хотел сказать… …мяу.' },
            { title: '— 3 —', description: 
            '- Но мне кажется, или вы уже понимаете, чем являются эти пронумерованные РЕЧИ, и к чему в скором времени они приведут. Что ж, я прекрасно знаю, что вы понимаете. Давайте-ка отбросим эти мысли в сторону и поговорим о чём-то другом. Вот например тот факт, что этот вебсайт вообще сущетствует. Да, это одна из моих креативных идей которая взбрела мне в мою черепную коробку. Что ж сказать, делать отдельный вебсайт для записывания моих РЕЧЕЙ вместо их записывания в том же телеграм-канале было довольно... нестандартной идеей. Нет, это не АРГ, я не прошу вас выходить на улицу и искать какие-то послания, спрятанные под камнем к примеру и решать загадки. Но честно, я бы это тоже сделал когда-нибудь, это прикольно. А это просто сайт, на который ты заходишь и клацаешь пронумерованные кнопочки чтобы увидеть текст от Данилки Терпилки (Ой, это не тот персонаж, КХМ-КХМ). Вам всё ещё будет интересно, что я вставлю на следующий день?' },
            { title: '— 4 —', description: 
            '- "My  name  is  Travdey". Такую фразу я однажды написал 24 ноября в 2018 году на рисунке, около зелёноволосого персонажа, с чёлкой странной формы, которого я нарисовал в paint.net, не имея при этом тотальных навыков рисования. С тех пор на свет появился тот персонаж, без которого я не могу представить свою дальнейшую жизнь. Идея о создании собственного оригинального пришла мне в голову тогда, когда на втором курсе образования в ШАГе, компьютерной академии, я узнал о том, что один из моих друзей, Кикс (тот самый Кикс, прошу заметить!!!) рассказал о том, что тот рисует и анимирует, и выкладывает свои рисунки, спидпэинты, прочие работы на ютуб канал. Тогда я загуглил название его канала в Гугле, за компом в ШАГе, во время занятия (да дааа, я ещё тот шалун), где выдало его персонажа который буквально являлся селф-инсертом Кикса: блондин, с белой кожей, с ". _ ." выражением лица, и яркая голубая худи. Тот простенького персонажа я запомнил, и Кикс был тем человек, который вдохновил меня на создание СОБСТВЕННОГО персонажа. Тогда, понятное дело, мне было где-то 8-9 лет, мой детский ум тогда тоже захотел себе какого-небудь персонажа, чтобы казаться крутым и особенным. чтобы иметь своего рода чарм перед Киксом и Мишей (Артошем). И вот так, в тот судьбоносный день, я сделал тоже персонажа с БЕЛОЙ кожей, с ТАКИМ ЖЕ худи как рисовал Кикс только другого цвета, а вот с глазками я решил чутка побаловаться: пусть у того персонажа будет виден один глаз, чёрный овальный такой, а другой будет закрыт своей же чёлкой. Только та чёлка была необычная, а имела свою особенную форму, которая вскоре сделала мою ОС такой оригинальной со своей изюминкой. А потом, подумав минуту как я назвал бы этого персонажа... остановился всё ж таки на необычном "Travdey". Я до сих пор понятия не имею почему именно Travdey, НО Я ТОЧНО УВЕРЕН, ЧТО ЭТО НЕ ИЗ-ЗА ТОГО, ЧТО ОН ЗЕЛЁНЫЙ И КОРЕНЬ "ТРАВ" ПОШЁЛ ЯВНО НЕ ОТ ЦВЕТА ОДЕЖДЫ И ВОЛОС ПЕРСОНАЖА. Просто тогда в 8-9 лет я захотел назвать моего персонажа Травдеем. Дорисовавши рисунок, я не просто его сохранил на ноуте, я ещё и РАСПЕЧАТАЛ его и на следующее занятие в ШАГе, подошёл к Киксу, достал из рюкзака распечатанный рисунок с Травдеем, и показал ему. Тогда он заценил, сказал "круто, прикольно", и я был доволен услышать это было от него. Класс, стремление к признанию от людей мне было ещё важно с самого детства, но да ладно. С тех пор, этот зелёноволосый чувак живёт в моей голове каждый день, которому скоро в ноябре этого года исполнится 8 лет со дня создания, а также это тот чувак, который за свою жизнь получил немало артиков от разных людей, в том числе друзей, знакомых, и чужих людей! А вот самый первый фанарт по Травдею, сделанный Томой ещё в далёком 2019 году! :)'},
            { title: '— 5 —', description: 
            '- Изначально я хотел быть програмистом-айтишником. Это желание начало присутствовать во мне где-то во время четвёртого класса. Затем, после того как я стал пробовать рисовать что угодно и пилить всякие анимации в Macromedia Flash 8 (та самая легендарная олдскульная программа для создания анимации и флеш игр), я решил, что "буду аниматором и поеду в Чехию в специальный университет для мультипликации!!! (на самом деле я услышал у одной ютуберши, что был один в Чехии такой классный университет, но даже сейчас я не уверен есть ли он там вообще)", и эта мысль держалась долго. Потом мысли сменились в сторону юриспруденции, задумывался становиться юристом, в особенности адвокатом. Но даже не смотря на эти желания и "козыри в кармане", я всё равно оставался неопределённым. С девятого класса я стал сомневаться в моих выборах и мыслях о том, кем я хочу быть в будущем. Затем наступает десятый класс, неопределённость профессии/специальности будущего словно стрелой в сердце вонзило... я буквально не знал, кто я до конца. Я стал чаще рисовать + у меня получается рисовать вещи, может быть всё-таки пойти в сферу анимации и попробовать себя там? "Да нет", думал я, "там низко платят в основном, на этом я точно не проживу". Мой папа имеет юридическое образование, мне нравится слушать о разных юридических фактах и частично о судебных делах (это ещё мне стало нравится после пиковых Ace Attorney и Better Call Saul) - мне НРАВИЛАСЬ юриспруденция (камон, я в девятом классе вёл урок английского языка про юриспруденцию, и мне было весело об этом рассказывать, не смотря на тот факт, что инфу, которую я подавал свои одноклассникам, была крайне базовой). Но мне было трудно себя представить как юриста. Признаюсь честно... скорее всего, это был страх ответственности за себя и других людей. Как правильный юрист, тебе предстоит следовать по закону, выполнять судебные требования, решать дела честно по закону, тебе предстоит отбросить мораль чтобы выполнять всё на законодательном уровне. Ты подтвергаешь большой ответственности себя и своим клиентам. Твои знания закона в суде и вне суда будут самыми решаемыми вещами в твоей профессии. Одна ошибка может стоить тебе репутации и даже лицензии юриста. Это ответственная работа, я благодарен всем достойным юристам, которые упорно работают в этой сфере и имеют хороший опыт в этом. Но окончательно, я ещё не был готов и на данный момент не готов к этой практике... слабак я в этом плане. В любом случае, начиная с 11-го класса я понял, что чувствую себя тотально неопределённым, будто я понятия не имел что меня ждёт в конце учебного года и что будет меня ждать после сдачи НМТ. Благо в начале зимы, мой мозг и рассудительность стали включаться, и мне удалось понять, что мои навыки рисования, моя любовь к деталям, внимание на различные рекламные билборды и баннеры в ИРЛ и в Интернете, моё умение пользоваться программами некоторыми, идеально подходят для того, чтобы я стал графическим дизайнером. Это престижная в наши тяжкие, заполоненные ИИ-слопом времена, профессия. И я такой: "Ну, раз уж так, то мне стоит попробовать себя в этом." И так начался мой путь к офигеванию того, что мне предстоит пройти творческие конкурсы перед поступлением, до этой точки в жизни, где я сдал одну работу на 200 баллов, и искренне надеюсь, что начиная с этого дня, 19 июля, я смогу поступить в желаемый универ. Хотя бы я не был до конца школы неопределённым, на этом спасибо. Теперь я просто надеюсь, что мне зайдёт эта сфера и то что я успешно закончу графический дизайн с дипломом бакалавра через четыре года. А пока... пока тут только стоит трудиться и учиться, и главное не терять дух в обучении этой обширной специальности.'},
            { title: '— 6 —', description:

        function renderRevealBlocks() {
            if (!revealList) {
                return;
            }

            const header = document.querySelector('.header-text');
            const footer = document.getElementById('footer');
            const imageBlocks = document.querySelectorAll('.image-block, .image-block2, .image-block3');

            if (header) {
                window.setTimeout(() => header.classList.add('is-visible'), 250);
            }

            if (imageBlocks.length) {
                imageBlocks.forEach((block, index) => {
                    window.setTimeout(() => block.classList.add('is-visible'), 250 + index * 120);
                });
            }

            if (footer) {
                window.setTimeout(() => footer.classList.add('is-visible'), 250);
            }

            const summaryBlock = document.getElementById('summaryBlock');
            if (summaryBlock) {
                window.setTimeout(() => summaryBlock.classList.add('is-visible'), 450);
            }

            const now = new Date();
            const currentDayIndex = now >= revealStartDate
                ? Math.min(revealTasks.length - 1, Math.floor((now - revealStartDate) / (1000 * 60 * 60 * 24)))
                : 0;
            revealList.innerHTML = '';

            revealTasks.forEach((task, index) => {
                const unlockDate = new Date(revealStartDate);
                unlockDate.setDate(revealStartDate.getDate() + index);
                const nextUnlockDate = new Date(unlockDate);
                nextUnlockDate.setDate(unlockDate.getDate() + 1);
                const isUnlocked = true;
                
                const mediaContent = index === 2
                    ? `<div class="reveal-media"><img src="./imgs/travdey.png" alt="travdey image"></div>`
                    : '';
                const mediaContent2 = index === 3
                    ? `<div class="reveal-media"><img src="./imgs/travtoma.jpg" alt="trav fanart by toma image"></div>`
                    : '';
                const mediaContent3 = index === 5
                    ? `<div class="reveal-media"><img src="./imgs/bluerose_FoR_or_RF.png" alt="flower image"></div>`
                    : '';
                const mediaContent4 = index === 14
                    ? `<div class="reveal-media"><img src="./imgs/travdey2.png" alt="7th anniversary image"></div>`
                    : '';
                const mediaContent5 = index === 20
                    ? `<div class="reveal-media"><img src="./imgs/bluerose_FoR_or_RF.png" alt="blue rose image"></div>`
                    : '';

                const item = document.createElement('div');
                item.className = 'reveal-item';
                item.innerHTML = `
                    <button class="reveal-trigger" type="button" ${isUnlocked ? '' : 'disabled'} aria-expanded="false" aria-controls="revealPanel-${index}">
                        —— РЕЧЬ ${index + 1} ——
                    </button>
                    <div class="reveal-panel" id="revealPanel-${index}">
                        <h3>${task.title}</h3>
                        <p>${task.description}</p>
                        ${mediaContent}
                        ${mediaContent2}
                        ${mediaContent3}
                        ${mediaContent4}
                        ${mediaContent5}
                        <p class="reveal-note">${isUnlocked ? '' : `Unlocks on ${unlockDate.toLocaleDateString('ru-RU')}`}</p>
                    </div>
                `;

                revealList.appendChild(item);

                window.setTimeout(() => {
                    item.classList.add('is-visible');
                }, 250 + index * 120);

                const button = item.querySelector('.reveal-trigger');
                const panel = item.querySelector('.reveal-panel');

                if (button && panel) {
                    button.addEventListener('click', () => {
                        if (!isUnlocked) {
                            return;
                        }
                        const isOpen = panel.classList.toggle('is-open');
                        button.setAttribute('aria-expanded', String(isOpen));
                        window.setTimeout(updateStarfieldSize, 300);
                    });
                }
            });
        }

        const starfield = document.getElementById('starfield');

        function updateStarfieldSize() {
            if (!starfield) {
                return;
            }

            starfield.style.height = `${Math.max(document.documentElement.scrollHeight, document.body.scrollHeight)}px`;
        }

        function createStar() {
            if (!starfield) {
                return;
            }

            const star = document.createElement('div');
            star.className = 'star';

            const size = Math.random() * 3 + 6;
            const top = Math.random() * 100;
            const left = Math.random() * 100;
            const opacity = Math.random() * 0.35 + 0.35;
            const duration = Math.random() * 6 + 12;
            const delay = Math.random() * 2.5;
            const easing = ['ease', 'ease-in', 'ease-out', 'ease-in-out'][Math.floor(Math.random() * 4)];

            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${top}%`;
            star.style.left = `${left}%`;
            star.style.opacity = `${opacity}`;
            star.style.animation = `star-fade ${duration}s ${easing} ${delay}s forwards`;
            star.style.backgroundSize = 'contain';
            star.style.backgroundRepeat = 'no-repeat';
            star.style.backgroundPosition = 'center';
            star.style.transform = 'translate(-50%, -50%) scale(0.2)';

            starfield.appendChild(star);
            window.setTimeout(() => {
                star.remove();
            }, (duration + delay) * 1000 + 800);
        }

        function launchStarSequence() {
            setInterval(() => {
                const count = Math.floor(Math.random() * 4) + 1;
                for (let i = 0; i < count; i += 1) {
                    setTimeout(createStar, i * 700);
                }
            }, 256);
        }

        window.addEventListener('load', () => {
            renderRevealBlocks();
            updateItemTimers();
            updateNextDialogueInfo();
            updateStarfieldSize();
            launchStarSequence();
        });
        window.addEventListener('resize', updateStarfieldSize);
    </script>
